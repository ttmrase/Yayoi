name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set private data dir (outside the repository)
        shell: bash
        # フォント(OFL・取得物)などの置き場。リポジトリの外に置く。
        run: echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,app,app-dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Check for private data (images / binaries / denylist)
        run: python scripts/check_no_private_data.py --all

      - name: Fetch handwriting fonts (SIL OFL, from google/fonts)
        run: python scripts/fetch_fonts.py

      - name: Test (slow tests excluded)
        run: python -m pytest -m "not slow"

  web:
    name: web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (Python server + frontend)
        run: |
          python -m pip install -e ".[dev,app,app-dev]"

      - name: Frontend install
        run: npm ci
        working-directory: web

      - name: Typecheck / unit tests / build
        run: |
          npm run typecheck
          npm test
          npm run build
        working-directory: web

      - name: Built bundle has no external resources
        run: python -m pytest tests/test_app_static.py

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: End-to-end tests (Playwright)
        run: npm run e2e
        working-directory: web
