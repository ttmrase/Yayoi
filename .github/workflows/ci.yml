name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      # フォント(OFL・取得物)などの置き場。リポジトリの外に置く。
      YAYOI_PRIVATE_DATA: ${{ runner.temp }}/yayoi_private
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Check for private data (images / binaries / denylist)
        run: python scripts/check_no_private_data.py --all

      - name: Fetch handwriting fonts (SIL OFL, from google/fonts)
        run: python scripts/fetch_fonts.py

      - name: Test (slow tests excluded)
        run: python -m pytest -m "not slow"
