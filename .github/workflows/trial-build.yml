name: Trial build

# 試用版の配布物(zip)を GitHub Actions でビルドして検査する。**公開はしない**(公開は trial-publish.yml。ユーザーが GitHub の画面で実行する)。
#
#   plan → shards(合成データ。100 ページずつ並列)→ base-weights / celltype / adapt(適応済みの重み + リハーサルの束)→ dumps(較正のダンプ 4 つ)
#        → confidence(確信度モデル)→ bundle(出所の文書を実際の重みの SHA256 で作り、束を作って検査)→ smoke-windows(この束そのものを Windows で)→ finalize
#
# 起動: .github/trial-build-request を変更して push する(mode: full = 配布用の本番ビルド / mini = 通し試験。mini の重みは使い物にならず、配布しない)。画面から手動でも起動できる。
# 重みの再利用: reuse_run_id に、成功した前の run を指定すると、シャード・セル種別分類器・基本/適応済みの重み・較正のダンプはその run の artifact を使い、
#   確信度の較正(confidence)以降(bundle → 検査 → Windows の煙試験 → finalize)だけをこの run で実行する。再利用の前に、前の run の段階のコマンドといまのコミットの処理が
#   同じであること、学習・認識・合成に関わるコードが変わっていないことを照合する(scripts/trial_ci.py reuse-check)。出所の文書に、再利用元の run・コミットと変更点を書く。
# 手順・seed・スレッド数は、docs/model_provenance.md §3 と docs/trial_rc.md §7.2 の手順(scripts/trial_ci.py が実行する)。
# 重みは、開発のコンテナで作ったものとビット単位では一致しない(CPU が違う)。束の出所の表は、実際に作った重みの SHA256 で作る。
# 成果物: artifact「trial-bundle」(mini は「trial-bundle-mini」)= zip・.sha256・出所の文書・ビルドの記録・検査の結果。
# 権限は contents: read だけ。外部アクションはすべてコミットの SHA で固定。

on:
  push:
    branches: [claude/handwritten-document-ocr-sgf76h]
    paths: [".github/trial-build-request"]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 配布用の本番ビルド / mini = 通し試験(配布しない)"
        type: choice
        options: [full, mini]
        default: mini # 誤って本番のビルドを始めないよう、既定は mini
      reuse_run_id:
        description: "重みと較正のダンプを再利用する、成功した trial-build の run_id(空 = 全部作る)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read # 再利用する run の確認と、その artifact のダウンロード(読み取りだけ)

concurrency:
  group: trial-build
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      shards: ${{ steps.p.outputs.shards }}
      dumps: ${{ steps.p.outputs.dumps }}
      artifact: ${{ steps.p.outputs.artifact }}
      reuse: ${{ steps.p.outputs.reuse }}
      reuse_commit: ${{ steps.reuse.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 再利用する run のコミットとの差を調べる
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: p
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REUSE: ${{ inputs.reuse_run_id }}
        run: |
          MODE="${INPUT_MODE:-}"; REUSE="${INPUT_REUSE:-}"
          if [ -z "$MODE" ]; then
            MODE=$(sed -n 's/^mode: *//p' .github/trial-build-request | head -1 | tr -d '[:space:]')
            REUSE=$(sed -n 's/^reuse_run_id: *//p' .github/trial-build-request | head -1 | tr -d '[:space:]')
          fi
          case "$MODE" in full|mini) ;; *) echo "mode が不正です: '$MODE'"; exit 1 ;; esac
          case "$REUSE" in *[!0-9]*) echo "reuse_run_id が不正です: '$REUSE'"; exit 1 ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          echo "shards=$(python scripts/trial_ci.py plan --mode "$MODE" --field shards)" >> "$GITHUB_OUTPUT"
          echo "dumps=$(python scripts/trial_ci.py plan --mode "$MODE" --field dumps)" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = full ]; then echo "artifact=trial-bundle" >> "$GITHUB_OUTPUT"; else echo "artifact=trial-bundle-mini" >> "$GITHUB_OUTPUT"; fi
          echo "モード: $MODE(コミット $GITHUB_SHA)。再利用する run: ${REUSE:-なし}"
      - name: Check the run to reuse (this workflow, this branch, succeeded)
        id: reuse
        if: steps.p.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ steps.p.outputs.reuse }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE" > "$RUNNER_TEMP/reuse-run.json"
          python scripts/trial_ci.py run-check --run "$RUNNER_TEMP/reuse-run.json" \
            --workflow-path .github/workflows/trial-build.yml --branch claude/handwritten-document-ocr-sgf76h
          echo "commit=$(python -c "import json; print(json.load(open('$RUNNER_TEMP/reuse-run.json'))['head_sha'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.p.outputs.reuse != ''
        with:
          pattern: meta.*
          merge-multiple: true
          run-id: ${{ steps.p.outputs.reuse }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused-meta
      - name: Check that the reused stages were made by the same recipe and code
        if: steps.p.outputs.reuse != ''
        run: >
          python scripts/trial_ci.py reuse-check --mode "${{ steps.p.outputs.mode }}"
          --infos "$RUNNER_TEMP/reused-meta/infos" --base-commit "${{ steps.reuse.outputs.commit }}"
          --data "$RUNNER_TEMP/yayoi_private/datasets" --models "$RUNNER_TEMP/yayoi_private/models" --evals "$RUNNER_TEMP/yayoi_private/evals"

  shards:
    name: data ${{ matrix.shard.id }}
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: |
          echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
          echo "META=$RUNNER_TEMP/meta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - name: Install
        run: python -m pip install -e . -c requirements/trial-build-linux.txt
      - name: Fetch handwriting fonts (google/fonts at a pinned commit, SHA-256 verified)
        run: python scripts/fetch_fonts.py --ref "$(sed -n 's/^ref=//p' requirements/fonts-pin.txt)" --verify requirements/fonts.sha256
      - name: Generate the synthetic pages of this shard
        run: >
          python scripts/trial_ci.py run shard --mode "${{ needs.plan.outputs.mode }}" --id "${{ matrix.shard.id }}" --jobs 3
          --data "$YAYOI_PRIVATE_DATA/datasets" --models "$YAYOI_PRIVATE_DATA/models" --evals "$YAYOI_PRIVATE_DATA/evals"
          --info "$META/infos/info.shard.${{ matrix.shard.id }}.json"
      - name: Summarize the shard (seeds, writers, fonts)
        run: python scripts/trial_ci.py summary --data "$YAYOI_PRIVATE_DATA/datasets" --out "$META/summaries" --id "${{ matrix.shard.id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data.${{ matrix.shard.id }}
          path: ${{ runner.temp }}/yayoi_private/datasets
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta.shard.${{ matrix.shard.id }}
          path: ${{ runner.temp }}/meta
          retention-days: 2
          if-no-files-found: error

  base-weights:
    name: base weights
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - name: Install (PyTorch CPU build, pinned libraries)
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple || python -m pip install "torch==2.15.0"
          python -m pip install -e ".[ml,ml-dev]" -c requirements/trial-build-linux.txt
      - name: Convert the base weights (NDLOCR-Lite ONNX at a pinned commit, SHA-256 verified)
        run: |
          python scripts/fetch_models.py --dest "$YAYOI_PRIVATE_DATA/models"
          rm -f "$YAYOI_PRIVATE_DATA"/models/*.onnx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w.base
          path: ${{ runner.temp }}/yayoi_private/models
          retention-days: 2
          if-no-files-found: error

  celltype:
    name: cell-type classifier
    needs: [plan, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: |
          echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
          echo "META=$RUNNER_TEMP/meta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - name: Install (PyTorch CPU build, pinned libraries)
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple || python -m pip install "torch==2.15.0"
          python -m pip install -e ".[ml,ml-dev]" -c requirements/trial-build-linux.txt
      - name: Fetch handwriting fonts (pinned commit, SHA-256 verified; the dataset signature check needs the font names)
        run: python scripts/fetch_fonts.py --ref "$(sed -n 's/^ref=//p' requirements/fonts-pin.txt)" --verify requirements/fonts.sha256
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: data.train.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/datasets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: data.calib.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/datasets
      - name: Train the cell-type classifier
        run: >
          python scripts/trial_ci.py run celltype --mode "${{ needs.plan.outputs.mode }}"
          --data "$YAYOI_PRIVATE_DATA/datasets" --models "$YAYOI_PRIVATE_DATA/models" --evals "$YAYOI_PRIVATE_DATA/evals"
          --info "$META/infos/info.celltype.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w.celltype
          path: ${{ runner.temp }}/yayoi_private/models/celltype.pt
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta.celltype
          path: ${{ runner.temp }}/meta
          retention-days: 2
          if-no-files-found: error

  adapt:
    name: adapted weights + rehearsal
    needs: [plan, shards, base-weights]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: |
          echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
          echo "META=$RUNNER_TEMP/meta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - name: Install (PyTorch CPU build, pinned libraries)
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple || python -m pip install "torch==2.15.0"
          python -m pip install -e ".[ml,ml-dev]" -c requirements/trial-build-linux.txt
      - name: Fetch handwriting fonts (pinned commit, SHA-256 verified; the dataset signature check needs the font names)
        run: python scripts/fetch_fonts.py --ref "$(sed -n 's/^ref=//p' requirements/fonts-pin.txt)" --verify requirements/fonts.sha256
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: data.train.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/datasets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: data.train_gen.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/datasets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: w.base
          path: ${{ runner.temp }}/yayoi_private/models
      - name: Adapt the recognizer weights on the synthetic data (L2-SP)
        run: >
          python scripts/trial_ci.py run adapt --mode "${{ needs.plan.outputs.mode }}"
          --data "$YAYOI_PRIVATE_DATA/datasets" --models "$YAYOI_PRIVATE_DATA/models" --evals "$YAYOI_PRIVATE_DATA/evals"
          --info "$META/infos/info.adapt.json"
      - name: Build the rehearsal bundle (synthetic cells)
        run: >
          python scripts/trial_ci.py run rehearsal --mode "${{ needs.plan.outputs.mode }}"
          --data "$YAYOI_PRIVATE_DATA/datasets" --models "$YAYOI_PRIVATE_DATA/models" --evals "$YAYOI_PRIVATE_DATA/evals"
          --info "$META/infos/info.rehearsal.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w.adapted
          path: |
            ${{ runner.temp }}/yayoi_private/models/adapted
            ${{ runner.temp }}/yayoi_private/models/rehearsal.npz
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta.adapt
          path: ${{ runner.temp }}/meta
          retention-days: 2
          if-no-files-found: error

  dumps:
    name: dump ${{ matrix.dump.dataset }} ${{ matrix.dump.weights }}
    needs: [plan, shards, base-weights, celltype, adapt]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        dump: ${{ fromJSON(needs.plan.outputs.dumps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: |
          echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
          echo "META=$RUNNER_TEMP/meta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - name: Install (PyTorch CPU build, pinned libraries)
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple || python -m pip install "torch==2.15.0"
          python -m pip install -e ".[ml,ml-dev]" -c requirements/trial-build-linux.txt
      - name: Fetch handwriting fonts (pinned commit, SHA-256 verified; the dataset signature check needs the font names)
        run: python scripts/fetch_fonts.py --ref "$(sed -n 's/^ref=//p' requirements/fonts-pin.txt)" --verify requirements/fonts.sha256
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: data.${{ matrix.dump.dataset }}.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/datasets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: w.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/models
      - name: Recognize the calibration pages and dump the features
        run: >
          python scripts/trial_ci.py run dump --mode "${{ needs.plan.outputs.mode }}"
          --dataset "${{ matrix.dump.dataset }}" --weights "${{ matrix.dump.weights }}"
          --data "$YAYOI_PRIVATE_DATA/datasets" --models "$YAYOI_PRIVATE_DATA/models" --evals "$YAYOI_PRIVATE_DATA/evals"
          --info "$META/infos/info.dump.${{ matrix.dump.dataset }}_${{ matrix.dump.weights }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dump.${{ matrix.dump.dataset }}.${{ matrix.dump.weights }}
          path: ${{ runner.temp }}/yayoi_private/evals
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta.dump.${{ matrix.dump.dataset }}.${{ matrix.dump.weights }}
          path: ${{ runner.temp }}/meta
          retention-days: 2
          if-no-files-found: error

  confidence:
    name: confidence models
    needs: [plan, dumps]
    # 再利用のとき、dumps は実行されない(skipped)。失敗・取り消しがなければ実行する
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: |
          echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
          echo "META=$RUNNER_TEMP/meta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - name: Install
        run: python -m pip install -e . -c requirements/trial-build-linux.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse == ''
        with:
          pattern: dump.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/evals
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          pattern: dump.*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.reuse }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yayoi_private/evals
      - name: Fit the confidence models (base and adapted weights)
        run: >
          python scripts/trial_ci.py run fit --mode "${{ needs.plan.outputs.mode }}"
          --data "$YAYOI_PRIVATE_DATA/datasets" --models "$YAYOI_PRIVATE_DATA/models" --evals "$YAYOI_PRIVATE_DATA/evals"
          --info "$META/infos/info.fit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w.confidence
          path: |
            ${{ runner.temp }}/yayoi_private/models/confidence.json
            ${{ runner.temp }}/yayoi_private/models/adapted/confidence.json
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta.fit
          path: ${{ runner.temp }}/meta
          retention-days: 2
          if-no-files-found: error

  bundle:
    name: bundle + verify
    needs: [plan, shards, base-weights, celltype, adapt, confidence]
    if: ${{ !cancelled() && !failure() && needs.confidence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        run: |
          echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
          echo "META=$RUNNER_TEMP/meta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/trial-build-linux.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (build tools; the bundle script imports the recognizer)
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple || python -m pip install "torch==2.15.0"
          python -m pip install -e ".[dev,app,ml,ml-dev]" wheel -c requirements/trial-build-linux.txt
      - name: Build the frontend
        run: |
          npm ci
          npm run build
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse == ''
        with:
          pattern: w.*
          merge-multiple: true
          path: ${{ runner.temp }}/yayoi_private/models
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse == ''
        with:
          pattern: meta.*
          merge-multiple: true
          path: ${{ runner.temp }}/meta
      # 再利用: 重みは前の run のもの(w.base・w.celltype・w.adapted)、確信度は、この run で較正し直したもの(w.confidence)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          name: w.base
          run-id: ${{ needs.plan.outputs.reuse }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yayoi_private/models
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          name: w.celltype
          run-id: ${{ needs.plan.outputs.reuse }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yayoi_private/models
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          name: w.adapted
          run-id: ${{ needs.plan.outputs.reuse }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yayoi_private/models
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          name: w.confidence
          path: ${{ runner.temp }}/yayoi_private/models
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          pattern: meta.*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.reuse }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/meta_reused
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse != ''
        with:
          name: meta.fit
          path: ${{ runner.temp }}/meta
      - name: Generate the provenance document (SHA-256 of the weights actually built) and the build record
        if: needs.plan.outputs.reuse == ''
        run: >
          python scripts/trial_ci.py provenance --mode "${{ needs.plan.outputs.mode }}"
          --models "$YAYOI_PRIVATE_DATA/models" --summaries "$META/summaries" --info "$META/infos"
          --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
          --out "$RUNNER_TEMP/model_provenance.generated.md" --build-info "$RUNNER_TEMP/build-info.json"
      - name: Generate the provenance document (weights reused from an earlier run; only the confidence fit is new)
        if: needs.plan.outputs.reuse != ''
        run: >
          python scripts/trial_ci.py provenance --mode "${{ needs.plan.outputs.mode }}"
          --models "$YAYOI_PRIVATE_DATA/models" --summaries "$RUNNER_TEMP/meta_reused/summaries" --info "$META/infos"
          --reuse-run-id "${{ needs.plan.outputs.reuse }}" --reuse-commit "${{ needs.plan.outputs.reuse_commit }}" --reuse-info "$RUNNER_TEMP/meta_reused/infos"
          --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
          --out "$RUNNER_TEMP/model_provenance.generated.md" --build-info "$RUNNER_TEMP/build-info.json"
      - name: Show the build record (reuse and the fixed confidence margins; statistics only)
        run: |
          python - <<'PY'
          import json, os
          i = json.load(open(os.environ["RUNNER_TEMP"] + "/build-info.json", encoding="utf-8"))
          print("reuse:", i.get("reuse"))
          print("fit_margins:", i.get("fit_margins"))
          print("stages:", sorted({(r["stage"], r.get("run_id")) for r in i["stages"]}))
          PY
          sed -n '1,22p' "$RUNNER_TEMP/model_provenance.generated.md" | cut -c1-400
      - name: Build the trial bundle (offline, complete)
        run: python scripts/make_trial_bundle.py --out "$RUNNER_TEMP/trial" --models "$YAYOI_PRIVATE_DATA/models" --provenance "$RUNNER_TEMP/model_provenance.generated.md"
      - name: Name and checksum the zip
        run: |
          cd "$RUNNER_TEMP/trial"
          if [ "${{ needs.plan.outputs.mode }}" != full ]; then
            mv yayoi-ocr-trial-*.zip yayoi-ocr-trial-0.1.0-MINI.zip
            rm -f ./*.sha256
            sha256sum yayoi-ocr-trial-0.1.0-MINI.zip > yayoi-ocr-trial-0.1.0-MINI.zip.sha256
          fi
          ls -la
      - name: Verify the bundle (B1–B7; no denylist in CI)
        run: |
          zip=$(ls "$RUNNER_TEMP"/trial/yayoi-ocr-trial-*.zip)
          python scripts/verify_trial_bundle.py "$zip" --provenance "$RUNNER_TEMP/model_provenance.generated.md" --no-denylist | tee "$RUNNER_TEMP/verify-output.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Collect the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP"/trial/yayoi-ocr-trial-*.zip "$RUNNER_TEMP"/trial/yayoi-ocr-trial-*.zip.sha256 "$RUNNER_TEMP/candidate/"
          cp "$RUNNER_TEMP/model_provenance.generated.md" "$RUNNER_TEMP/verify-output.txt" "$RUNNER_TEMP/candidate/"
          python scripts/trial_ci.py augment --info "$RUNNER_TEMP/build-info.json" --out "$RUNNER_TEMP/candidate/build-info.json" \
            --zip "$(ls "$RUNNER_TEMP"/candidate/yayoi-ocr-trial-*.zip)" --verify-output "$RUNNER_TEMP/candidate/verify-output.txt"
          ls -la "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  smoke-windows:
    # この束そのもの(適応済みの重みを含む)を、Windows で: 展開 → setup.ps1(同梱の Python・オフライン・ハッシュ検証)→ 開発用でないモードで起動 →
    # HTTP の煙試験(取り込み〜認識〜確定〜cp932 の出力〜バックアップ〜復元)→ アンインストール。IME・高 DPI・実機の WebView2・弥生への実際の取り込みは実機の確認項目。
    name: smoke (windows, the bundle itself)
    needs: [plan, bundle]
    # 再利用のとき、上流の shards などが skipped で、暗黙の success() だと、この job も飛ばされる(通し試験で確認)。bundle が成功したときだけ実行する
    if: ${{ !cancelled() && !failure() && needs.bundle.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set private data dir (outside the repository)
        shell: bash
        run: echo "YAYOI_PRIVATE_DATA=$RUNNER_TEMP/yayoi_private" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11" # 同梱の Python と同じ系統
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (the smoke script runs in the dev environment)
        run: python -m pip install -e ".[dev,app,app-dev]"
      - name: Fetch handwriting fonts (pinned commit, SHA-256 verified; for the synthetic smoke page)
        shell: powershell
        run: |
          $ref = (Select-String -Path requirements/fonts-pin.txt -Pattern '^ref=(\w+)').Matches[0].Groups[1].Value
          python scripts/fetch_fonts.py --ref $ref --verify requirements/fonts.sha256
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-candidate
          path: ${{ runner.temp }}/candidate

      - name: Check the downloaded zip against its checksum file
        shell: powershell
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\candidate" -Filter "yayoi-ocr-trial-*.zip" | Select-Object -First 1
          $want = (Get-Content ($zip.FullName + ".sha256") | Select-Object -First 1).Split(" ")[0].ToLower()
          $got = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "zip: $($zip.Name) $got"
          if ($got -ne $want) { Write-Host "SHA256 mismatch (want $want)"; exit 1 }

      - name: Install with setup.ps1 (Windows PowerShell 5.1, bundled Python, offline, hash-verified)
        shell: powershell
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\candidate" -Filter "yayoi-ocr-trial-*.zip" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bundle" | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip.FullName -C "$env:RUNNER_TEMP\bundle"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\bundle\setup.ps1" -InstallDir "$env:RUNNER_TEMP\yayoi-ocr"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (non-dev server over HTTP)
        shell: powershell
        run: |
          python scripts/trial_smoke.py --python "$env:RUNNER_TEMP\yayoi-ocr\venv\Scripts\python.exe" --models "$env:RUNNER_TEMP\yayoi-ocr\models" --data-dir "$env:RUNNER_TEMP\yayoi-ocr" --timeout 1500
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Window launch check (informational)
        continue-on-error: true
        shell: powershell
        run: |
          $env:YAYOI_MODELS_DIR = "$env:RUNNER_TEMP\yayoi-ocr\models"
          $env:YAYOI_APP_DATA = "$env:RUNNER_TEMP\window-data"
          $out = "$env:RUNNER_TEMP\window.out"; $err = "$env:RUNNER_TEMP\window.err"
          $p = $null
          try {
            # venv の python.exe は、実体の python.exe を子プロセスとして起動する。待ち受けは子プロセス側なので、プロセスの木全体で見る
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\yayoi-ocr\venv\Scripts\python.exe" -ArgumentList "-m","yayoi_ocr.app" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            Start-Sleep -Seconds 30
            if ($p.HasExited) { Write-Host "exited early: $($p.ExitCode)"; Get-Content $err -Tail 40; exit 1 }
            $ids = @($p.Id) + @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | ForEach-Object { $_.ProcessId })
            $conn = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess })
            $conn | Format-Table LocalAddress, LocalPort, OwningProcess
            if ($conn.Count -eq 0) { Write-Host "no listener"; Get-Content $err -Tail 40; exit 1 }
            if ($conn | Where-Object { $_.LocalAddress -ne "127.0.0.1" }) { Write-Host "non-loopback listener"; exit 1 }
          } finally {
            if ($p) { & taskkill /PID $p.Id /T /F | Out-Null }
          }

      - name: Installed files (manual, licenses, uninstall script)
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\yayoi-ocr"
          foreach ($f in "manual.html", "user_manual.md", "uninstall.ps1", "NOTICE.txt") { if (-not (Test-Path "$d\$f")) { Write-Host "missing: $f"; exit 1 } }
          if (-not (Get-ChildItem "$d\licenses" -Recurse -File -ErrorAction SilentlyContinue)) { Write-Host "no license texts"; exit 1 }
          Write-Host ("license text files: " + (Get-ChildItem "$d\licenses" -Recurse -File).Count)

      - name: Uninstall (keeps the data and the learned generations), then -DeleteData (needs DELETE typed)
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\yayoi-ocr"
          New-Item -ItemType Directory -Force -Path "$d\images\1" | Out-Null
          Set-Content "$d\app.sqlite3" "x"; Set-Content "$d\images\1\1.png" "x"
          New-Item -ItemType Directory -Force -Path "$d\models\1\gen_0001" | Out-Null
          Set-Content "$d\models\1\gen_0001\keep.txt" "x"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$d\uninstall.ps1" -InstallDir $d
          if ($LASTEXITCODE -ne 0) { Write-Host "uninstall failed"; exit 1 }
          foreach ($n in "venv", "python", "start-yayoi-ocr.cmd") { if (Test-Path "$d\$n") { Write-Host "program remains: $n"; exit 1 } }
          if ((Test-Path "$d\models\NDLmoji.yaml") -or (Get-ChildItem "$d\models" -Filter *.pt -ErrorAction SilentlyContinue)) { Write-Host "shipped weights remain"; exit 1 }
          if (-not (Test-Path "$d\models\1\gen_0001\keep.txt")) { Write-Host "a generation was removed"; exit 1 }
          if (-not (Test-Path "$d\app.sqlite3") -or -not (Test-Path "$d\images\1\1.png")) { Write-Host "data was removed"; exit 1 }
          "no" | & powershell -NoProfile -ExecutionPolicy Bypass -File "$d\uninstall.ps1" -InstallDir $d -DeleteData
          if ($LASTEXITCODE -eq 0) { Write-Host "should have aborted"; exit 1 }
          if (-not (Test-Path "$d\app.sqlite3")) { Write-Host "data removed without confirmation"; exit 1 }
          "DELETE" | & powershell -NoProfile -ExecutionPolicy Bypass -File "$d\uninstall.ps1" -InstallDir $d -DeleteData
          if ($LASTEXITCODE -ne 0) { Write-Host "delete failed"; exit 1 }
          if (Test-Path $d) { Write-Host "folder remains"; Get-ChildItem $d -Force; exit 1 }
          exit 0 # 最後に実行した外部コマンドの終了コード(拒否の 1)を、このステップの結果にしない

      - name: Record the smoke result (bound to the SHA-256 of the zip that was tested)
        shell: powershell
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\candidate" -Filter "yayoi-ocr-trial-*.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $os = (Get-CimInstance Win32_OperatingSystem).Caption
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke-result" | Out-Null
          $obj = [ordered]@{ passed = $true; zip_name = $zip.Name; zip_sha256 = $hash; os = $os; image = $env:ImageVersion; steps = "extract, setup.ps1, smoke (HTTP, non-dev server), window launch, installed files, uninstall" }
          $obj | ConvertTo-Json | Out-File -Encoding ascii "$env:RUNNER_TEMP\smoke-result\smoke-windows.json"
          Get-Content "$env:RUNNER_TEMP\smoke-result\smoke-windows.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-result
          path: ${{ runner.temp }}/smoke-result
          retention-days: 7
          if-no-files-found: error

  finalize:
    name: finalize (trial-bundle artifact)
    needs: [plan, bundle, smoke-windows]
    if: ${{ !cancelled() && !failure() && needs.bundle.result == 'success' && needs.smoke-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (the verify script imports the package for its version)
        run: python -m pip install -e . -c requirements/trial-build-linux.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-result
          path: ${{ runner.temp }}/candidate
      - name: Re-verify the candidate and record the smoke result
        run: |
          cd "$RUNNER_TEMP/candidate"
          zip=$(ls yayoi-ocr-trial-*.zip)
          python "$GITHUB_WORKSPACE/scripts/verify_trial_bundle.py" "$zip" --provenance model_provenance.generated.md --no-denylist | tee verify-output.txt
          test "${PIPESTATUS[0]}" -eq 0
          python "$GITHUB_WORKSPACE/scripts/trial_ci.py" augment --info build-info.json --out build-info.json --zip "$zip" \
            --verify-output verify-output.txt --smoke smoke-windows.json
          cat build-info.json | head -40
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "### 試用版のビルド(モード: ${{ needs.plan.outputs.mode }})"
            echo
            echo "- コミット: \`$GITHUB_SHA\`  run: $GITHUB_RUN_ID"
            echo "- zip: \`$(cd "$RUNNER_TEMP/candidate" && ls yayoi-ocr-trial-*.zip)\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "$RUNNER_TEMP"/candidate/yayoi-ocr-trial-*.zip.sha256)\`"
            echo "- 検査: verify_trial_bundle B1〜B7 OK / Windows の煙試験(この束そのもの)OK"
            echo "- artifact: \`${{ needs.plan.outputs.artifact }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
