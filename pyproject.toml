[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yayoi-ocr"
version = "0.1.0"
description = "手書き経理帳票のスキャン画像を OCR し、弥生会計向け CSV に変換する(Windows・完全オフライン)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "pypdfium2>=4.30",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# 認識(PyTorch)。アプリ本体の実行・学習に必要。CI の既定には入れない(重いので ml マーカーのテストは skip)
ml = ["torch>=2.4", "PyYAML>=6"]
# 確認 UI(Phase 3): ローカルサーバ。desktop は Windows のウィンドウ(WebView2)用
app = ["fastapi>=0.115", "uvicorn>=0.30"]
app-dev = ["httpx>=0.27"]
desktop = ["pywebview>=5.0"]
# 開発用: ONNX からの重み復元と NDLOCR-Lite の ONNX との数値一致テスト
ml-dev = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
yayoi-ocr = "yayoi_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yayoi_ocr = ["templates/*.json", "app/static/**/*", "app/data/*.json", "app/data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "samples: 実サンプル画像(YAYOI_PRIVATE_DATA/samples)が必要なテスト。無ければ skip",
    "slow: 時間のかかるテスト",
    "needs_font: 日本語フォントが必要なテスト(合成帳票)。無ければ skip",
    "ml: PyTorch(と、必要なら models の重み・onnx・onnxruntime)が必要なテスト。無ければ skip",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 日本語の全角文字を許可
    "E501",                        # 全角を幅 2 で数えるため、コメント・docstring の長さは見ない(コードは ruff format が折り返す)
    "N803", "N806",                # 画像処理で H, W 等の大文字変数を使う
]

[tool.ruff.lint.per-file-ignores]
# baudm/parseq 由来のコード(`F` は torch.nn.functional の慣用名)
"src/yayoi_ocr/recognize/parseq/*.py" = ["N812"]
